# Canary: apply a full-stack-fastapi-template ref to this consumer and let the
# repo's real CI validate it. A dedicated repo-scoped GitHub App (CopierCanaryBot)
# mints a write token incl. workflows:write, so the push carries .github/workflows/**
# (which GITHUB_TOKEN cannot) and - not being GITHUB_TOKEN - triggers CI natively.
name: canary

on:
  workflow_dispatch:
    inputs:
      template_ref:
        description: "full-stack-fastapi-template ref (branch, tag, or SHA) to canary"
        required: false
        default: master
      base_branch:
        description: "consumer branch to apply the template onto / open the PR against (blank = repo default branch)"
        required: false
        default: ""
  # Self-test: run only when a PR edits this workflow. The job-level `if` below
  # skips canary/* PRs so the canary never re-triggers on its own branch.
  pull_request:
    paths:
      - ".github/workflows/canary.yml"
  schedule:
    # Daily at 08:00 UTC (GitHub cron is always UTC).
    - cron: "0 8 * * *"

# Own GITHUB_TOKEN only reads (the gate). Every write uses the App token.
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

# Per-ref group so unrelated runs don't cancel each other (the old flat
# `canary-master` cancelled in-flight runs). PR runs key on the head branch,
# dispatch on the chosen ref, schedule/push on the ref name.
concurrency:
  group: canary-${{ github.event.pull_request.head.ref || format('base-{0}-target-{1}', github.event.inputs.base_branch || github.event.repository.default_branch, github.event.inputs.template_ref || 'master') }}
  cancel-in-progress: true

env:
  TEMPLATE_REF: ${{ github.event.inputs.template_ref || 'master' }}
  BASE_BRANCH: ${{ github.event.inputs.base_branch || github.event.repository.default_branch }}

jobs:
  canary:
    # Never canary the canary's own branch (would loop / feed cancellations).
    if: ${{ !startsWith(github.head_ref, 'canary/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint a WRITE token from the canary App (incl. workflows:write)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CANARY_APP_CLIENT_ID }}
          private-key: ${{ secrets.CANARY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: read
          permission-workflows: write
          repositories: ${{ github.event.repository.name }}

      - name: Check out this repo with the App token (so the push uses it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Apply onto the chosen base for dispatch/schedule; keep the PR merge
          # ref for the self-test (pull_request) so canary.yml edits are exercised.
          ref: ${{ github.event_name == 'pull_request' && github.ref || env.BASE_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv (provides uvx to run copier)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Apply the template ref with copier update
        run: |
          # .git: template overrides _exclude, dropping copier's default .git skip.
          # .agents/.claude: master carries dangling skill symlinks there copier
          # can't read (present only on the dev tip).
          uvx --from copier==9.16.0 copier update --vcs-ref "${TEMPLATE_REF}" \
            --exclude '.git' --exclude '.agents' --exclude '.claude' \
            --skip-answered --defaults --answers-file .copier/.copier-answers.yml --trust

      - name: Commit and push the canary branch if anything changed
        id: commit
        run: |
          git config user.name  "canary-bot"
          git config user.email "canary-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No template changes for ${TEMPLATE_REF} - nothing to canary."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Encodes both endpoints: lands on <base>, applies template <ref>.
          # Slugify '/' in the refs (e.g. release/2) so an embedded slash doesn't
          # split the branch path. The real refs are used verbatim elsewhere
          # (copier --vcs-ref, gh pr --base).
          base_slug="${BASE_BRANCH//\//-}"
          target_slug="${TEMPLATE_REF//\//-}"
          branch="canary/base-${base_slug}-target-${target_slug}"
          git switch -c "${branch}"
          git commit -m "canary: apply full-stack-fastapi-template@${TEMPLATE_REF}"
          # On a pull_request run the checkout is the PR merge ref, not the base;
          # rebase our single commit onto the real base so the PR stays one clean
          # commit (no merge commit, no unrelated commits).
          git fetch --no-tags origin "${BASE_BRANCH}"
          git rebase --onto FETCH_HEAD "${branch}~1" "${branch}"
          # App-token push INCLUDES .github/workflows/** and triggers CI natively.
          git push -f origin "${branch}"
          echo "changed=true"     >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Open or refresh the canary PR
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          gh pr create --base "${BASE_BRANCH}" --head "${BRANCH}" \
            --title "[DO NOT MERGE] canary: template@${TEMPLATE_REF}" \
            --body "Automated canary via CopierCanaryBot. The push includes .github/workflows/** and triggers CI natively." \
            || echo "PR already exists; updated via force-push."
          echo "url=$(gh pr view "${BRANCH}" --json url -q .url)" >> "${GITHUB_OUTPUT}"

      - name: Watch and report the consumer PR's CI (lenient - never hard-fails)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          echo "Canary PR: ${PR_URL}"
          # Wait for the native CI checks to register, then watch to completion.
          for _ in $(seq 1 20); do
            [ -n "$(gh pr checks "${BRANCH}" 2>/dev/null)" ] && break
            echo "waiting for canary checks to register…"; sleep 15
          done
          # Lenient: report status but do not fail the canary job (|| true).
          gh pr checks "${BRANCH}" --watch --interval 30 || true
          {
            echo "### Canary CI results"
            echo ""
            echo "PR: ${PR_URL}"
            echo ""
            echo '```'
            gh pr checks "${BRANCH}" || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
